# Format, lint, tests, and the smoke run (tables + Stealth Frontier figure rebuilt
# from the committed per-flight results). The dataset is not in the repository, so
# tests that need it are skipped here.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .
      - name: Smoke run
        env:
          AEROVIGIL_ALLOW_MISSING_DATA: "1"
        run: make smoke
