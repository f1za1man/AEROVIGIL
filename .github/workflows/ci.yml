# Format, lint, tests, and the smoke run (tables + Stealth Frontier figure rebuilt
# from the committed per-flight results). The dataset is not in the repository, so
# tests that need it are skipped here. Each part is its own step; on failure the last
# lines of its output are posted as an annotation on the run.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AEROVIGIL_ALLOW_MISSING_DATA: "1"
      MPLBACKEND: Agg
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Step A compares with an older commit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .
      - name: Format (black)
        run: .github/report.sh black python -m black --check --line-length 88 src/aerovigil tests app
      - name: Lint (ruff)
        run: .github/report.sh ruff python -m ruff check src/aerovigil tests app
      - name: Tests (pytest)
        run: .github/report.sh pytest python -m pytest tests -q -rfE
      - name: Rebuild every table
        run: .github/report.sh tables python src/aerovigil/evaluation/run_all.py
      - name: Redraw the Stealth Frontier figure
        run: .github/report.sh figure python src/aerovigil/stealth/figures.py
      - name: Results unchanged by the rebuild
        run: |
          report=$(python .github/compare_results.py)
          echo "$report"
          if [ "$report" != "no result changed" ]; then
            echo "::warning title=rebuilt results differ::$(echo "$report" | head -30 | awk '{printf "%s%%0A", $0}')"
          fi
